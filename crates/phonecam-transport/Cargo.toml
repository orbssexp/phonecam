[package]
name = "phonecam-transport"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "PhoneCam desktop transport: relay signaling, str0m ICE-lite receiver, NACK/RTX, interface watch, heartbeat"

[dependencies]
phonecam-core = { path = "../phonecam-core" }
str0m = { version = "0.24", default-features = false, features = ["wincrypto"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
if-addrs = "0.13"
serde = "1"
serde_json = "1"
getrandom = "0.2"
tracing = "0.1"
mdns-sd = "0.21.7"
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
